<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Learning Companion</title>
    <style>
        :root {
            --bg: #f7f4ef;
            --panel: #ffffff;
            --ink: #18212f;
            --muted: #607086;
            --line: #d9e0e8;
            --accent: #d83434;
            --accent-dark: #a91f1f;
            --focus: #0f766e;
            --shadow: 0 20px 55px rgba(24, 33, 47, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(216, 52, 52, 0.12), rgba(15, 118, 110, 0.1)),
                var(--bg);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .auth-panel {
            width: min(100%, 430px);
            border: 1px solid rgba(24, 33, 47, 0.08);
            border-radius: 8px;
            padding: 34px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
        }

        .play-mark {
            display: inline-grid;
            width: 36px;
            height: 26px;
            place-items: center;
            border-radius: 6px;
            background: var(--accent);
        }

        .play-mark::before {
            content: "";
            width: 0;
            height: 0;
            margin-left: 3px;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 11px solid #fff;
        }

        h1 {
            margin: 32px 0 8px;
            font-size: 2rem;
            line-height: 1.12;
        }

        .lede {
            margin: 0 0 26px;
            color: var(--muted);
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: grid;
            gap: 8px;
            color: #2a3547;
            font-size: 0.92rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 52px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0 15px;
            color: var(--ink);
            background: #fbfcfd;
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--focus);
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.14);
        }

        button {
            min-height: 54px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            background: var(--accent);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-dark);
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 54px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            bottom: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            min-height: 36px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0;
            color: var(--ink);
            background: #fff;
        }

        .toggle-password:hover {
            color: #fff;
            background: var(--accent-dark);
        }

        .toggle-password svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
        }

        .eye-off-icon {
            display: none;
        }

        .toggle-password.is-visible .eye-icon {
            display: none;
        }

        .toggle-password.is-visible .eye-off-icon {
            display: block;
        }

        .message,
        .errorlist {
            margin: 0 0 16px;
            border-radius: 8px;
            padding: 12px 14px;
            color: #842029;
            background: #f8d7da;
        }

        .errorlist {
            padding-left: 32px;
        }

        .auth-link {
            margin: 20px 0 0;
            color: var(--muted);
            text-align: center;
        }

        a {
            color: var(--accent-dark);
            font-weight: 800;
        }
    </style>
</head>
<body>
    <main class="auth-panel">
        <div class="brand">
            <span class="play-mark" aria-hidden="true"></span>
            Learning Companion
        </div>

        <h1>Log in</h1>
        <p class="lede">Access your video summarizer workspace.</p>

        {% if form.errors %}
            <p class="message">Your username or email and password did not match. Please try again.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <label for="{{ form.username.id_for_label }}">
                Username or email
                {{ form.username }}
            </label>

            <label class="password-field" for="{{ form.password.id_for_label }}">
                Password
                {{ form.password }}
                <button class="toggle-password" type="button" aria-controls="{{ form.password.id_for_label }}" aria-label="Show password">
                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M3 3l18 18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M10.6 10.6a3 3 0 0 0 3.8 3.8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6 0 9.5 7 9.5 7a18 18 0 0 1-2.7 3.8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M6.6 6.8C3.9 8.7 2.5 12 2.5 12s3.5 7 9.5 7c1.3 0 2.5-.3 3.5-.8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
            </label>

            <button type="submit">Log in</button>
        </form>

        <p class="auth-link">Need an account? <a href="{% url 'signup' %}">Sign up</a></p>
    </main>
    <script>
        const passwordInput = document.querySelector("#{{ form.password.id_for_label }}");
        const togglePassword = document.querySelector(".toggle-password");

        togglePassword.addEventListener("click", () => {
            const shouldShow = passwordInput.type === "password";
            passwordInput.type = shouldShow ? "text" : "password";
            togglePassword.classList.toggle("is-visible", shouldShow);
            togglePassword.setAttribute("aria-label", shouldShow ? "Hide password" : "Show password");
        });
    </script>
</body>
</html>
