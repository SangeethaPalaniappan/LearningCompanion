<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Learning Companion</title>
    <style>
        :root {
            --bg: #f7f4ef;
            --panel: #ffffff;
            --ink: #18212f;
            --muted: #607086;
            --line: #d9e0e8;
            --accent: #d83434;
            --accent-dark: #a91f1f;
            --focus: #0f766e;
            --shadow: 0 20px 55px rgba(24, 33, 47, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(216, 52, 52, 0.12), rgba(15, 118, 110, 0.1)),
                var(--bg);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .auth-panel {
            width: min(100%, 460px);
            border: 1px solid rgba(24, 33, 47, 0.08);
            border-radius: 8px;
            padding: 34px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
        }

        .play-mark {
            display: inline-grid;
            width: 36px;
            height: 26px;
            place-items: center;
            border-radius: 6px;
            background: var(--accent);
        }

        .play-mark::before {
            content: "";
            width: 0;
            height: 0;
            margin-left: 3px;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 11px solid #fff;
        }

        h1 {
            margin: 32px 0 8px;
            font-size: 2rem;
            line-height: 1.12;
        }

        .lede,
        .helptext,
        .auth-link {
            color: var(--muted);
        }

        .lede {
            margin: 0 0 26px;
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: grid;
            gap: 8px;
            color: #2a3547;
            font-size: 0.92rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 52px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0 15px;
            color: var(--ink);
            background: #fbfcfd;
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--focus);
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.14);
        }

        button {
            min-height: 54px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            background: var(--accent);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-dark);
        }

        .helptext {
            font-size: 0.82rem;
            font-weight: 500;
            line-height: 1.5;
        }

        .errorlist {
            margin: 0;
            border-radius: 8px;
            padding: 12px 14px 12px 32px;
            color: #842029;
            background: #f8d7da;
        }

        .auth-link {
            margin: 20px 0 0;
            text-align: center;
        }

        a {
            color: var(--accent-dark);
            font-weight: 800;
        }
    </style>
</head>
<body>
    <main class="auth-panel">
        <div class="brand">
            <span class="play-mark" aria-hidden="true"></span>
            Learning Companion
        </div>

        <h1>Create account</h1>
        <p class="lede">Sign up to start using the video summarizer.</p>

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                    {{ field }}
                    {% if field.help_text %}
                        <span class="helptext">{{ field.help_text }}</span>
                    {% endif %}
                </label>
                {{ field.errors }}
            {% endfor %}

            <button type="submit">Create account</button>
        </form>

        <p class="auth-link">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </main>
</body>
</html>
